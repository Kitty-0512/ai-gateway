name: Keep Deploy Alive

on:
  schedule:
    # 每 5 分钟 ping 一次（降低冷启动/闲置停机概率）
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: |
          curl -sf https://ai-gateway-production-74c4.up.railway.app/api/health/live
          echo "✅ Ping done"
